name: Build Neon Cube Rush APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # LINUX DEPENDENCIES
      # ==========================================

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            python3-dev


      # ==========================================
      # BUILD ENVIRONMENT
      # ==========================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            setuptools==58.0.4 \
            wheel

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.33


      # ==========================================
      # VERIFY PROJECT
      # ==========================================

      - name: Verify project
        run: |
          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""

          if [ ! -f main.py ]; then
            echo "ERROR: main.py not found"
            exit 1
          fi

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          echo "main.py: OK"
          echo "buildozer.spec: OK"


      # ==========================================
      # IMPORTANT:
      # REMOVE OLD BROKEN BUILD ENVIRONMENT
      # ==========================================

      - name: Clean Buildozer environment
        run: |
          echo "Removing old Buildozer Android environment..."

          rm -rf .buildozer
          rm -rf "$HOME/.buildozer"

          echo "Clean environment ready."


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Android APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          buildozer -v android debug


      # ==========================================
      # FIND APK
      # ==========================================

      - name: Find generated APK
        if: always()
        run: |
          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.buildozer/*" \
            -print

          echo ""
          echo "=========================================="
          echo "BIN DIRECTORY"
          echo "=========================================="

          if [ -d "bin" ]; then
            ls -lah bin/
          else
            echo "bin directory does not exist"
          fi


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # UPLOAD LOGS IF BUILD FAILS
      # ==========================================

      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-Build-Logs
          path: |
            .buildozer/
            ~/.buildozer/
          retention-days: 7
          if-no-files-found: ignore
