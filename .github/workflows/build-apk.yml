name: Build Neon Cube Rush APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ─────────────────────────────
      # 1. Récupérer le projet
      # ─────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4


      # ─────────────────────────────
      # 2. Python
      # ─────────────────────────────

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ─────────────────────────────
      # 3. Java
      # ─────────────────────────────

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ─────────────────────────────
      # 4. Dépendances Linux
      # ─────────────────────────────

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            python3-dev


      # ─────────────────────────────
      # 5. Installer Buildozer
      # ─────────────────────────────

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.33


      # ─────────────────────────────
      # 6. Installer Android SDK
      # ─────────────────────────────

      - name: Install Android SDK
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip

          rm -rf "$SDK_ROOT/cmdline-tools/latest"

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          cp -R cmdline-tools/* \
            "$SDK_ROOT/cmdline-tools/latest/"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0"

          echo ""
          echo "===== INSTALLED BUILD TOOLS ====="

          ls -lah "$SDK_ROOT/build-tools"

          echo ""
          echo "===== AIDL ====="

          find "$SDK_ROOT/build-tools" \
            -name aidl \
            -type f \
            -print


      # ─────────────────────────────
      # 7. Vérifier AIDL
      # ─────────────────────────────

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Build Tools:"

          ls -lah "$ANDROID_HOME/build-tools"

          echo ""
          echo "AIDL:"

          "$ANDROID_HOME/build-tools/34.0.0/aidl" --version

          echo ""
          echo "✅ AIDL fonctionne"


      # ─────────────────────────────
      # 8. Vérifier le projet
      # ─────────────────────────────

      - name: Verify project
        run: |
          echo "===== PROJECT ====="

          pwd
          ls -la

          test -f main.py || {
            echo "❌ main.py missing"
            exit 1
          }

          test -f buildozer.spec || {
            echo "❌ buildozer.spec missing"
            exit 1
          }

          echo "✅ main.py"
          echo "✅ buildozer.spec"


      # ─────────────────────────────
      # 9. Build
      # ─────────────────────────────

      - name: Build APK
        run: |
          buildozer -v android debug


      # ─────────────────────────────
      # 10. Chercher l'APK
      # ─────────────────────────────

      - name: Find APK
        if: always()
        run: |
          echo "===== APK ====="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.buildozer/*" \
            -print

          echo ""
          echo "===== BIN ====="

          if [ -d bin ]; then
            ls -lah bin
          fi


      # ─────────────────────────────
      # 11. Envoyer l'APK
      # ─────────────────────────────

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ─────────────────────────────
      # 12. Logs en cas d'échec
      # ─────────────────────────────

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-Build-Logs
          path: |
            .buildozer/
            ~/.buildozer/
          retention-days: 7
          if-no-files-found: ignore
