name: 🎮 Build Neon Cube Rush APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ─────────────────────────────
      # Récupération du projet
      # ─────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────
      # Python
      # ─────────────────────────────
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ─────────────────────────────
      # Java
      #
      # IMPORTANT :
      # Pas de "cache: gradle".
      # Buildozer génère le projet Gradle
      # pendant le build.
      # ─────────────────────────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ─────────────────────────────
      # Dépendances Linux
      # ─────────────────────────────
      - name: 📦 Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            python3-dev

      # ─────────────────────────────
      # Installation Buildozer
      # ─────────────────────────────
      - name: 🔧 Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.33

      # ─────────────────────────────
      # Vérification
      # ─────────────────────────────
      - name: 🔎 Check project
        run: |
          echo "===== PROJECT ====="
          ls -la

          echo ""
          echo "===== REQUIRED FILES ====="

          test -f main.py
          test -f buildozer.spec

          echo "✅ main.py found"
          echo "✅ buildozer.spec found"

      # ─────────────────────────────
      # Build APK
      # ─────────────────────────────
      - name: 🏗️ Build APK
        run: |
          buildozer -v android debug

      # ─────────────────────────────
      # Afficher les APK générés
      # ─────────────────────────────
      - name: 🔍 Find APK
        if: always()
        run: |
          echo "===== APK FILES ====="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.buildozer/*" \
            -print

      # ─────────────────────────────
      # Upload APK dans Artifacts
      # ─────────────────────────────
      - name: 📱 Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ─────────────────────────────
      # Upload logs en cas de problème
      # ─────────────────────────────
      - name: 📋 Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-Build-Logs
          path: |
            ~/.buildozer/
            .buildozer/
          retention-days: 7
          if-no-files-found: ignore
