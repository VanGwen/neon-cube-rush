name: Build Neon Cube Rush APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            python3-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.33

      - name: Verify project
        run: |
          echo "===== PROJECT ====="
          pwd
          ls -la

          test -f main.py
          test -f buildozer.spec

          echo "main.py: OK"
          echo "buildozer.spec: OK"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show APK
        if: always()
        run: |
          echo "===== GENERATED APK ====="
          find . -type f -name "*.apk" -not -path "./.buildozer/*" -print

          echo ""
          echo "===== BIN ====="
          ls -lah bin/ 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-Build-Logs
          path: |
            .buildozer/
            ~/.buildozer/
          retention-days: 7
          if-no-files-found: ignore
