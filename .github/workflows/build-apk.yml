name: Build Neon Cube Rush APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    timeout-minutes: 120

    steps:

      # ─────────────────────────────
      # 1. Récupérer le projet
      # ─────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4


      # ─────────────────────────────
      # 2. Installer Python
      #
      # IMPORTANT :
      # Aucun cache pip ici.
      # ─────────────────────────────

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ─────────────────────────────
      # 3. Installer Java 17
      #
      # IMPORTANT :
      # Aucun cache Gradle ici.
      # ─────────────────────────────

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ─────────────────────────────
      # 4. Dépendances système
      # ─────────────────────────────

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            unzip \
            zip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            python3-dev


      # ─────────────────────────────
      # 5. Installer Buildozer
      # ─────────────────────────────

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.33


      # ─────────────────────────────
      # 6. Vérifier les fichiers
      # ─────────────────────────────

      - name: Verify project
        run: |
          echo "================================="
          echo "PROJECT FILES"
          echo "================================="

          pwd
          ls -la

          echo ""
          echo "Checking required files..."

          if [ ! -f "main.py" ]; then
            echo "❌ main.py is missing!"
            exit 1
          fi

          if [ ! -f "buildozer.spec" ]; then
            echo "❌ buildozer.spec is missing!"
            exit 1
          fi

          echo "✅ main.py found"
          echo "✅ buildozer.spec found"


      # ─────────────────────────────
      # 7. Vérifier Buildozer
      # ─────────────────────────────

      - name: Check Buildozer
        run: |
          python --version
          pip --version
          buildozer --version


      # ─────────────────────────────
      # 8. Construire l'APK
      # ─────────────────────────────

      - name: Build APK
        run: |
          buildozer -v android debug


      # ─────────────────────────────
      # 9. Chercher l'APK
      # ─────────────────────────────

      - name: Find APK
        if: always()
        run: |
          echo "================================="
          echo "SEARCHING FOR APK"
          echo "================================="

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.buildozer/*" \
            -print

          echo ""
          echo "Contents of bin/:"

          if [ -d "bin" ]; then
            ls -lah bin/
          else
            echo "bin/ does not exist"
          fi


      # ─────────────────────────────
      # 10. Envoyer l'APK dans Artifacts
      # ─────────────────────────────

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30


      # ─────────────────────────────
      # 11. En cas d'erreur :
      # récupérer les logs
      # ─────────────────────────────

      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-Build-Logs
          path: |
            .buildozer/
            ~/.buildozer/
          retention-days: 7
          if-no-files-found: ignore
