name: 🎮 Build Neon Cube Rush APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git wget unzip curl \
            libssl-dev libffi-dev python3-dev \
            zlib1g-dev autoconf libtool \
            pkg-config libltdl-dev

      - name: 💾 Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: 🔧 Installer Buildozer & Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.33

      - name: 🔎 Vérifier le projet Buildozer
        run: |
          test -f buildozer.spec
          test -f main.py

      - name: 🏗️ Compiler APK (debug)
        run: buildozer -v android debug

      # Diagnostic : montre ce qui a été généré
      - name: 🔍 Vérifier APK
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin/ introuvable"
          echo "=== APK trouvés ==="
          find . -name "*.apk" 2>/dev/null || echo "Aucun APK"

      - name: 📱 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-APK
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Upload logs (toujours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/.buildozer/logs/
          retention-days: 7
          if-no-files-found: ignore
