name: 🎮 Build Neon Cube Rush APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:       # Bouton "Run workflow" manuel sur GitHub

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # 1 ─ Récupérer le code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2 ─ Java 17 (requis par Android SDK)
      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3 ─ Python 3.11
      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4 ─ Dépendances système Linux
      - name: 📦 Dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git wget unzip curl \
            libssl-dev libffi-dev python3-dev \
            zlib1g-dev autoconf libtool \
            pkg-config libltdl-dev

      # 5 ─ Cache (.buildozer = SDK/NDK/dépendances déjà compilées)
      #     La 2e compilation sera 10× plus rapide grâce à ce cache.
      - name: 💾 Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      # 6 ─ Installer Buildozer + Cython
      - name: 🔧 Installer Buildozer & Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.33

      # 7 ─ Compiler l'APK
      - name: 🏗️ Compiler APK (debug)
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      # 8 ─ Uploader l'APK comme artefact téléchargeable
      - name: 📱 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonCubeRush-APK
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      # 9 ─ En cas d'erreur : uploader les logs pour diagnostiquer
      - name: 📋 Upload logs (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7
