name: 🎮 Build Neon Cube Rush APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: ☕ Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 📦 Dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git wget unzip curl \
            libssl-dev libffi-dev python3-dev \
            zlib1g-dev autoconf libtool \
            pkg-config libltdl-dev

      - name: 💾 Cache Buildozer
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: 🔧 Installer Buildozer & Cython
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install buildozer==1.5.0 cython==0.29.33

      - name: 🔎 Vérifier les fichiers du projet
        run: |
          test -f buildozer.spec || { echo 'ERREUR : buildozer.spec est absent à la racine du dépôt.'; exit 1; }
          test -f main.py || { echo 'ERREUR : main.py est absent à la racine du dépôt.'; exit 1; }

      - name: 🏗️ Compiler APK (debug)
        id: compile
        run: buildozer -v android debug

      - name: 🔍 Diagnostic des APK
        if: always()
        run: |
          echo '=== Contenu de bin/ ==='
          ls -la bin/ 2>/dev/null || echo 'bin/ introuvable'
          echo '=== APK trouvés ==='
          find . -type f -name '*.apk' -not -path './.buildozer/*' 2>/dev/null || true
          echo '=== Fin du diagnostic ==='

      - name: 📱 Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: NeonCubeRush-APK
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📋 Upload logs Buildozer
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            ~/.buildozer/logs/
            .buildozer/android/platform/build-*/build.log
          retention-days: 7
          if-no-files-found: ignore
